  <text x="286" y="149" font-family="'Courier New', monospace" font-size="11" fill="#f87171" text-anchor="middle" font-weight="bold">JCL</text>

  <rect x="316" y="134" width="58" height="22" rx="11" fill="#1a2e1a"/>
  <text x="345" y="149" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="bold">Gemini</text>

