  <text x="580" y="93"  font-family="'Courier New', monospace" font-size="10" fill="#374151" text-anchor="middle">↓ WiFi</text>
  <text x="580" y="111" font-family="'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">🤖 AI API</text>
  <text x="580" y="129" font-family="'Courier New', monospace" font-size="10" fill="#374151" text-anchor="middle">↓ WiFi</text>
  <text x="580" y="147" font-family="'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">🖥 Pico W</text>
  <text x="580" y="165" font-family="'Courier New', monospace" font-size="10" fill="#374151" text-anchor="middle">↓ USB</text>
  <text x="580" y="183" font-family="'Courier New', monospace" font-size="11" fill="#60a5fa" text-anchor="middle">💻 your PC</text>

