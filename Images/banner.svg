  <rect x="77"  y="64" width="11" height="11" rx="2" fill="#60a5fa"/>
  <rect x="90"  y="64" width="11" height="11" rx="2" fill="#60a5fa"/>
  <rect x="103" y="64" width="11" height="11" rx="2" fill="#60a5fa"/>
  <rect x="116" y="64" width="11" height="11" rx="2" fill="#60a5fa"/>
